[pytest]
# presentations/ holds the deck-rule guards (no-raw-markers, body-budget
# split, chart hard rules). With `testpaths = tests` they were only collected
# when someone named the path explicitly — a guard that silently never runs is
# exactly the fail-open bug class HANDOVER.md warns about.
testpaths = tests presentations
markers =
    network: hits a live external API (PubMed eutils). Skipped unless RUN_NETWORK_TESTS=1.
